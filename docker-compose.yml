services:
  api:
    build: .
    command: sh -c "DATABASE_URL=postgresql+psycopg://gatekeep:gatekeep@postgres:5432/gatekeep alembic upgrade head && DATABASE_URL=postgresql+psycopg://gatekeep_app:gatekeep@postgres:5432/gatekeep uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://gatekeep_app:gatekeep@postgres:5432/gatekeep
      - MIGRATION_DATABASE_URL=postgresql+psycopg://gatekeep:gatekeep@postgres:5432/gatekeep
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatekeep
      POSTGRES_USER: gatekeep
      POSTGRES_PASSWORD: gatekeep
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeep -d gatekeep"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
