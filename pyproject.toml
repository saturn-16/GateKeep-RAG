[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeep-rag"
version = "0.1.0"
description = "Permission-aware multi-tenant RAG service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "qdrant-client>=1.19.1,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=6.19,<7",
  "python-docx>=1.1,<2",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=9.0.3,<10", "pytest-cov>=7,<8", "testcontainers[postgres]>=4.9,<5"]
security = ["PyJWT>=2.9,<3"]
redis = ["redis>=5,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_stack: requires live Qdrant and PostgreSQL services",
  "ollama: opt-in test requiring running Ollama daemon with llama3.2:3b",
  "model_download: opt-in test requiring network model download",
]

[tool.setuptools.packages.find]
where = ["src"]
