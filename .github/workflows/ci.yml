name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gatekeep
          POSTGRES_USER: gatekeep
          POSTGRES_PASSWORD: gatekeep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatekeep -d gatekeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]
      - run: pip install pip-audit
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://gatekeep:gatekeep@localhost:5432/gatekeep
      - run: python scripts/seed_demo.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql+psycopg://gatekeep:gatekeep@localhost:5432/gatekeep
          PERSISTENCE_BACKEND: postgres
          VECTOR_BACKEND: qdrant
      - run: python -m pytest -q --cov=app --cov-report=term-missing
      - run: python -m pytest -q tests/integration/test_real_stack.py tests/integration/test_live_security.py tests/integration/test_audit_concurrency.py tests/integration/test_document_mutations.py tests/integration/test_rate_limit.py tests/integration/test_admin_endpoints.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql+psycopg://gatekeep:gatekeep@localhost:5432/gatekeep
          PERSISTENCE_BACKEND: postgres
          VECTOR_BACKEND: qdrant
          RUN_REAL_STACK: "1"
      - run: python -m compileall -q src tests
      - run: python -m pip freeze | grep -v '^-e ' > audit-requirements.txt
      - run: pip-audit -r audit-requirements.txt --no-deps
      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact --verbose
