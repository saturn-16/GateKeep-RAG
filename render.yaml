services:
  # GateKeep Unified Web Application (100% Free Tier - No Payment Required)
  - type: web
    name: gatekeep-rag
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PERSISTENCE_BACKEND
        value: memory
      - key: VECTOR_BACKEND
        value: memory
      - key: RUN_REAL_STACK
        value: "0"
      - key: JWT_SECRET
        generateValue: true
